<!DOCTYPE html>
<!-- set language -->
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <!-- set site title -->
    <title>Pomodoro Timer</title>
    <!-- connect to style -->
    <link rel="stylesheet" href="style.css">
    <!-- set the unique font-->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>
<!-- add container class-->
<div class="container">
    <!-- delete?-->
    <h2 id="quote"></h2>

    <script>
    <!-- add quotes-->
    const quotes = [
        "Stay hard!",
        "STAY ******* HARD!",
        "Who's gonna carry the boats?  ...and the logs?",
        "You're gonna do it",
        "You don't know me son!",
        "You're just a *****",
        "This is your new normal",
        "Absolute savage",
        "It *****...It just ******* *****",
        "Take their ******* souls",
        "I wish the water was cold",
        "Stop when you're done",
        "You really are a *****",
        "Do some ******* ****",
        "Don't stop when you're tired",
        "You don't know ****",
        "Talk less, do more"
        ];
    <!-- randomize quotes -->
    function newQuote() {
        const random = Math.floor(Math.random() * quotes.length);
        document.getElementById("quote").innerText = quotes[random];
        console.log("It changed", quotes[random]);
    }

    newQuote();
    <!-- set time interval -->
    setInterval(newQuote, 300000);
    </script>
    <!-- add timer id-->
    <div id="timer">25:00</div>
    <!-- start, pause, reset buttons -->
    <div class="buttons">
        <button id="start" style="font-size: 30px; padding: 10px 20px; cursor: pointer;">►</button>
        <button id="pause" style="font-size: 30px; padding: 10px 20px; cursor: pointer;">⏸︎</button>
        <button id="reset" style="font-size: 30px; padding: 10px 20px; cursor: pointer;">⏹︎</button>
    </div>
</div>
<!-- connect to js-->
<script src="script.js"></script>
</body>
</html>
